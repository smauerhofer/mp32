# forth.cfg - the linker configuration of the FORTH kernel (see memory.md)
#
#   mp32ld -C forth.cfg -o build/forth.bin -m build/forth.map build/forth.o
#   mp32img -o build/forth.img build/forth.bin
#
# The image goes to 0, as os.s (the boot loader sets VEC = 0): the first module's CODE
# begins with the vector table. The system area ($770000 - $77FFFF: the globals, the
# queues, OPERATOR's task area and its stacks) has fixed addresses (memmap.inc) and is
# not in the image: COLD clears and fills it. The dictionary grows from the kernel's
# end (BSS end) up to DICT_END ($200000); RAM here ends there.

MEMORY {
    RAM: start = $00000000, size = $200000, file = "%O", format = bin;
}

SEGMENTS {
    CODE:   load = RAM, type = ro;
    RODATA: load = RAM, type = ro;
    DATA:   load = RAM, type = rw;
    BSS:    load = RAM, type = bss, define = yes;
}
