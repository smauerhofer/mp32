# mp32.cfg - linker configuration for the example (the same as mp32ld's
# built-in one; see mp32ld --print-config).
#
# BRAM is the 8 KB block RAM at $F0000000 the processor boots from. Its image is
# written as a $readmemh file, one 16-byte line per row, for BRAM_INIT of
# cpu/stage4/membus.v.

MEMORY {
    BRAM:  start = $F0000000, size = $2000, file = "%O", fill = yes, format = hex;
    SDRAM: start = $00000000, size = $800000;
}

SEGMENTS {
    CODE:   load = BRAM, type = ro;
    RODATA: load = BRAM, type = ro;
    DATA:   load = BRAM, type = rw;
    BSS:    load = BRAM, type = bss, define = yes;
    HEAP:   load = SDRAM, type = bss, define = yes;
}
