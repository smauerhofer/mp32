# os.cfg - the linker configuration of an operating system the boot loader loads
# (boot.s): everything in the SDRAM from 0 on, written as a raw binary (%O, e.g.
# build/os.bin) for mp32img, which puts the header in front (build/os.img).
#
#   mp32ld -C os.cfg -o build/os.bin -m build/os.map build/os.o
#   mp32img -o build/os.img build/os.bin
#
# The first module's CODE starts at 0 and begins with the vector table: the loader sets
# VEC = 0 and starts at entry 0, the reset. The file ends with the last byte that is not
# BSS: BSS is not in the image, and the loader does not clear it.
#
# RAM ends where the screen starts ($780000, write-through in the cache); the LISP heap
# (1 MB .. 7.5 MB in os.s) is not a segment: os.s sets L and HLIM itself.

MEMORY {
    RAM: start = $00000000, size = $780000, file = "%O", format = bin;
}

SEGMENTS {
    CODE:   load = RAM, type = ro;
    RODATA: load = RAM, type = ro;
    DATA:   load = RAM, type = rw;
    BSS:    load = RAM, type = bss, define = yes;
}
